name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan committed history with redacted output
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/repo:ro"
          zricethezav/gitleaks:v8.24.2
          git --redact --no-banner --log-opts=--all /repo
